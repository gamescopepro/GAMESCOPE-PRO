name: Site smoke checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/smoke-check.mjs"
      - ".github/workflows/site-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/smoke-check.mjs"
      - ".github/workflows/site-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static site smoke checks
        run: node scripts/smoke-check.mjs
