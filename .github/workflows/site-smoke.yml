name: Site smoke checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/smoke-check.mjs"
      - "scripts/browser-smoke.cjs"
      - ".github/workflows/site-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/smoke-check.mjs"
      - "scripts/browser-smoke.cjs"
      - ".github/workflows/site-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static site smoke checks
        run: node scripts/smoke-check.mjs

  browser:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Playwright
        run: |
          npm init -y
          npm install --no-save --no-package-lock playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser checks
        run: node scripts/browser-smoke.cjs
